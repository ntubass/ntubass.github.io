# Pull request 的檢查：確認網站能正常建置、每個頁面都打得開。
# （推送到 main / master 時的建置與部署在 deploy.yml）
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Smoke tests
        run: npm run test:smoke
